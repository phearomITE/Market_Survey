<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KB Outlet Movement</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/web/map.css">
</head>
<body>
  <header><b>KB OUTLET MOVEMENT</b><span>Kobo Survey Data</span>
    <nav><button id="mapViewBtn">🗺 Map</button><button id="dashboardBtn">▦ Dashboard</button><button id="refreshBtn">↻</button></nav>
  </header>
  <button id="openFilters" class="mobile-only">Filters</button>
  <main id="mapScreen">
    <aside id="filterPanel"><button id="closeFilters" class="mobile-only">×</button>
      <label>Region<select id="region"><option value="">All</option></select></label>
      <label>Dealer<select id="dealer"><option value="">All</option></select></label>
      <label>Report Date<select id="reportDate"><option value="">All</option></select></label>
      <label>Province / Capital<select id="province"><option value="">All</option></select></label>
      <label>District / Khan<select id="district"><option value="">All</option></select></label>
      <label>Commune / Sangkat<select id="commune"><option value="">All</option></select></label>
      <label>Product Category<select id="category"><option value="">All</option></select></label>
      <label>Product<select id="product"><option value="">All</option></select></label>
      <label>Movement Score<select id="movement"><option value="">All</option><option value="0-4">0–4</option><option value="5-8">5–8</option><option value="9-10">9–10</option></select></label>
      <button id="applyBtn">Apply Filters</button><button id="resetBtn">Reset</button>
    </aside>
    <section class="map-wrap"><div id="map"></div><div id="loading" class="loading">Loading…</div><div id="emptyState" class="empty hidden"></div><div id="stats"></div><article id="detailCard" class="detail hidden"></article></section>
  </main>
  <main id="dashboardScreen" class="dashboard hidden"><section id="dashboardFilters"></section><section id="kpiGrid"></section><section class="charts"><article><h3>Regions</h3><div id="regionChart"></div></article><article><h3>Dealers</h3><div id="dealerChart"></div></article><article><h3>Products</h3><div id="productChart"></div></article></section></main>
  <dialog id="editDialog"><form id="editForm"><h3 id="editTitle"></h3><label>Movement<input id="editMovement" type="number" min="0" max="10" required></label><label>Stock<input id="editStock"></label><label>ស្ថានភាពលក់<select id="editSalesStatus"><option value="">—</option><option value="អត់មានលក់">អត់មានលក់</option><option value="មានលក់">មានលក់</option><option value="លក់ដាច់">លក់ដាច់</option></select></label><label>Key issue<textarea id="editIssue"></textarea></label><div><button type="button" id="cancelEdit">Cancel</button><button type="submit">Save</button></div><button type="button" id="closeEdit" class="dialog-close">×</button></form></dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/web/map.js"></script>
</body>
</html>
